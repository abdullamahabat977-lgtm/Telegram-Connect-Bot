name: Validate Serverless JavaScript

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find tgcloud -type f -name '*.js' -print0)

      - name: Test inline and reply keyboard button styles
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const source = readFileSync('tgcloud/lib/shared.js', 'utf8');
          const start = source.indexOf('const KEYBOARD_DANGER_WORDS');
          const end = source.indexOf('\nlet inlinePromptTrackingReady', start);
          assert.ok(start >= 0 && end > start, 'Could not locate the keyboard style helper');
          const moduleUrl = 'data:text/javascript;base64,' + Buffer.from(source.slice(start, end)).toString('base64');
          const { styleKeyboardMarkup } = await import(moduleUrl);

          const inline = styleKeyboardMarkup({ inline_keyboard: [[
            { text: 'Accept request', callback_data: 'conn:accept:1' },
            { text: 'Reject request', callback_data: 'conn:reject:1' },
            { text: 'Unblock user', callback_data: 'admin:unblock:2' },
            { text: 'Likes +', callback_data: 'admin:balance:likes:add:2' },
            { text: 'Likes −', callback_data: 'admin:balance:likes:sub:2' }
          ]] });
          assert.equal(inline.inline_keyboard[0][0].style, 'success');
          assert.equal(inline.inline_keyboard[0][1].style, 'danger');
          assert.equal(inline.inline_keyboard[0][2].style, 'success');
          assert.equal(inline.inline_keyboard[0][3].style, 'success');
          assert.equal(inline.inline_keyboard[0][4].style, 'danger');

          const neutralInline = styleKeyboardMarkup({ inline_keyboard: [[
            { text: 'Profile', callback_data: 'menu:profile' },
            { text: 'Game', callback_data: 'menu:game' },
            { text: 'Settings', callback_data: 'menu:settings' }
          ]] });
          assert.deepEqual(
            [...new Set(neutralInline.inline_keyboard[0].map(button => button.style))].sort(),
            ['danger', 'primary', 'success'],
            'Neutral inline buttons should rotate through all three supported colors'
          );

          const reply = styleKeyboardMarkup({ keyboard: [
            ['Main menu', 'Profile', 'Game', { text: 'Delete photo', callback_data: 'photo:delete' }]
          ], resize_keyboard: true });
          assert.equal(reply.keyboard[0][0].style, 'primary');
          assert.equal(reply.keyboard[0][1].style, 'success');
          assert.equal(reply.keyboard[0][2].style, 'danger');
          assert.equal(reply.keyboard[0][3].style, 'danger');
          assert.ok(reply.keyboard.flat().every(button => typeof button === 'object' && ['primary', 'success', 'danger'].includes(button.style)));
          console.log('Inline and reply keyboard styles passed.');
          JS

      - name: Validate data-integrity migration
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.executescript("""
          CREATE TABLE users (id INTEGER PRIMARY KEY, telegram_id INTEGER UNIQUE NOT NULL, likes INTEGER NOT NULL DEFAULT 0);
          CREATE TABLE favorites (id INTEGER PRIMARY KEY, user_telegram_id INTEGER NOT NULL, favorite_telegram_id INTEGER NOT NULL);
          CREATE TABLE user_blocks (id INTEGER PRIMARY KEY, blocker_telegram_id INTEGER NOT NULL, blocked_telegram_id INTEGER NOT NULL);
          CREATE TABLE user_likes (id INTEGER PRIMARY KEY, liker_id INTEGER NOT NULL, liked_id INTEGER NOT NULL);
          CREATE TABLE user_ratings (id INTEGER PRIMARY KEY, session_id INTEGER NOT NULL, rater_id INTEGER NOT NULL, rated_id INTEGER NOT NULL, rating INTEGER NOT NULL);
          INSERT INTO users (telegram_id, likes) VALUES (100, 0), (200, 99);
          INSERT INTO favorites VALUES (1, 100, 200), (2, 100, 200);
          INSERT INTO user_blocks VALUES (1, 100, 200), (2, 100, 200);
          INSERT INTO user_likes VALUES (1, 100, 200), (2, 100, 200);
          INSERT INTO user_ratings VALUES (1, 5, 100, 200, 5), (2, 5, 100, 200, 4);
          """)
          db.executescript(Path("migrations/2026-10-12-data-integrity.sql").read_text())
          for table in ("favorites", "user_blocks", "user_likes", "user_ratings"):
              assert db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0] == 1, table
          # Likes are also a reward/admin balance; migration must preserve it.
          assert db.execute("SELECT likes FROM users WHERE telegram_id = 200").fetchone()[0] == 99
          try:
              db.execute("INSERT INTO user_likes (liker_id, liked_id) VALUES (100, 200)")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError("The migration did not enforce unique user_likes pairs")
          PY
